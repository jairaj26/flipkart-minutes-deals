name: Diagnostic Probe
on:
  workflow_dispatch:

jobs:
  run-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r bot/requirements.txt
      - name: Run Diagnostic Probe
        env:
          FLIPKART_COOKIE: ${{ secrets.FLIPKART_COOKIE }}
          PINCODE: ${{ secrets.PINCODE || '560045' }}
        run: python diagnostic_probe.py
