name: Flipkart Minutes Deals Alert

on:
  schedule:
    # Runs at minute 30 UTC every hour (= minute 00 of every hour IST, UTC+5:30)
    # E.g., 15:30 UTC = 21:00 IST, 16:30 UTC = 22:00 IST
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Minimum Discount % threshold'
        required: false
        default: '70'
      pincode:
        description: 'Delivery Pincode'
        required: false
        default: '560045'
      dry_run:
        description: 'Dry run (do not post to Telegram)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-and-alert:
    name: Scrape Deals & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Restore Deals Cache
        uses: actions/cache@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
          restore-keys: |
            deals-cache-

      - name: Run Flipkart Minutes Deals Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINCODE: ${{ inputs.pincode || secrets.PINCODE || '560045' }}
          MIN_DISCOUNT: ${{ inputs.min_discount || secrets.MIN_DISCOUNT || '70' }}
          FLIPKART_COOKIE: ${{ secrets.FLIPKART_COOKIE }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_WORKERS: '5'
        run: |
          python -m bot.main

      - name: Save Deals Cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
