name: Flipkart Minutes Deals Alert

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      min_discount:
        description: 'Minimum Discount % threshold'
        required: false
        default: '50'
      pincode:
        description: 'Delivery Pincode'
        required: false
        default: '560032'
      dry_run:
        description: 'Dry run (do not post to Telegram)'
        required: false
        default: 'false'
        type: boolean

jobs:
  scrape-and-alert:
    name: Scrape Deals & Alert Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Restore Deals Cache
        uses: actions/cache@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
          restore-keys: |
            deals-cache-

      - name: Run Flipkart Minutes Deals Scraper
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PINCODE: ${{ inputs.pincode || secrets.PINCODE || '560032' }}
          MIN_DISCOUNT: ${{ inputs.min_discount || secrets.MIN_DISCOUNT || '50' }}
          FLIPKART_COOKIE: ${{ secrets.FLIPKART_COOKIE }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          MAX_WORKERS: '5'
        run: |
          python -m bot.main

      - name: Save Deals Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/posted_deals.json
          key: deals-cache-${{ github.run_id }}
